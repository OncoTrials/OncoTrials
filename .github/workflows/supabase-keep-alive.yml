# Helper to prevent Supabase project from pausing (Hopefully it works)
name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * 1,4' # Runs every Monday and Thursday at midnight
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/organizations?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
        # The -f flag ensures the step fails if Supabase returns an error (e.g. 401, 503)
